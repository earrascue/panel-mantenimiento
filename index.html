   PASO 1: Copia tu hoja "Programacion" de SharePoint a Google Sheets
   PASO 2: Archivo → Compartir → Publicar en la web
           Elige hoja "Programacion" → formato CSV → Publicar
           Copia la URL y pégala en URL_CSV abajo
   PASO 3: Abre este HTML en el navegador de la TV

   ══════════════════════════════════════════════════════════════ */
// ── URLs de tus Google Sheets (ya configuradas) ──────────────
const URL_PROGRAMACION = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_7AdjZ0uu6OsLe_dGyg6HaiQGJn7h76myxExy-a_YaO1P2iLRfthSox1l3PtKQLHL41Dk6DlAKMpk/pub?gid=0&single=true&output=csv";
const URL_COMUNICADOS  = "https://docs.google.com/spreadsheets/d/e/2PACX-1vT_7AdjZ0uu6OsLe_dGyg6HaiQGJn7h76myxExy-a_YaO1P2iLRfthSox1l3PtKQLHL41Dk6DlAKMpk/pub?gid=998519694&single=true&output=csv";

// Mapeo flexible de columnas — busca el nombre exacto o variantes
function col(row, ...names){
  for(const n of names){ if(row[n]!==undefined && row[n]!=='') return row[n]; }
  return '';
}

// Extrae el ID del spreadsheet desde la URL CSV publicada
function getSheetId(csvUrl){
  const m = csvUrl.match(/spreadsheets\/d\/e\/([^/]+)/);
  return m ? m[1] : null;
}
function getGid(csvUrl){
  const m = csvUrl.match(/gid=(\d+)/);
  return m ? m[1] : '0';
}

// Cuántos segundos entre actualizaciones
const REFRESH_SEG = 90;

// Mostrar OT solo del día de hoy (true) o todos (false)
const SOLO_HOY = true;

<script>
/* ── RELOJ ── */
function tick(){
  const n=new Date();
  document.getElementById('clk-t').textContent=n.toLocaleTimeString('es-PE',{hour:'2-digit',minute:'2-digit'});
  document.getElementById('clk-d').textContent=n.toLocaleDateString('es-PE',{weekday:'long',day:'numeric',month:'long'}).toUpperCase();

  // Turno automático por hora
  const h=n.getHours();
  const tb=document.getElementById('turno-badge');
  if(h>=7&&h<20){tb.textContent='☀ TURNO MAÑANA';tb.className='turno-badge';}
  else{tb.textContent='🌙 TURNO NOCHE';tb.className='turno-badge noche';}
}
setInterval(tick,1000);tick();

/* ── CSV PARSER (handles quoted commas) ── */
function parseCSV(text){
  const rows=[];let cur=[],f='',inQ=false;
  for(let i=0;i<text.length;i++){
    const c=text[i];
    if(c==='"'){if(inQ&&text[i+1]==='"'){f+='"';i++;}else inQ=!inQ;}
    else if(c===','&&!inQ){cur.push(f.trim());f='';}
    else if((c==='\n'||c==='\r')&&!inQ){
      cur.push(f.trim());f='';
      if(cur.some(v=>v!==''))rows.push(cur);
      cur=[];if(c==='\r'&&text[i+1]==='\n')i++;
    }else f+=c;
  }
  if(f||cur.length){cur.push(f.trim());if(cur.some(v=>v!==''))rows.push(cur);}
  if(rows.length<2)return[];
  const hdr=rows[0].map(h=>h.replace(/^\uFEFF/,''));
  return rows.slice(1).map(r=>{const o={};hdr.forEach((h,i)=>o[h]=r[i]||'');return o;});
}

/* ── NORMALIZAR CONFORMIDAD ── */
function normConf(s){
  const v=(s||'').toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').trim();
  if(!v||v==='none'||v==='') return 'pendiente';
  if(v.includes('exitosa')||v.includes('exitoso')||v.includes('ejecutado')||v.includes('ejecutada')||v.includes('completado')||v.includes('conforme')) return 'exitosa';
  if(v.includes('fallida')||v.includes('fallido')||v.includes('no conforme')||v.includes('observado')) return 'fallida';
  if(v.includes('cancelad')) return 'cancelado';
  if(v.includes('programad')||v.includes('planificad')||v.includes('pendiente')) return 'pendiente';
  if(v.includes('progreso')||v.includes('proceso')||v.includes('ejecucion')) return 'en_progreso';
  return 'pendiente';
}
function confLabel(s){
  const v=(s||'').trim();
  if(!v||v.toUpperCase()==='NONE') return 'Sin confirmar';
  if(v.length>18) return v.slice(0,16)+'…';
  return v.toUpperCase();
}

/* ── ESCAPE HTML ── */
function esc(s){return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

/* ── FORMATEAR HORA ── */
function fmtHora(s){
  if(!s||s==='None') return '—';
  // puede venir como "07:30:00" o "0.3125" (fracción de día Excel)
  if(s.includes(':')) return s.slice(0,5);
  const n=parseFloat(s);
  if(!isNaN(n)&&n>=0&&n<=1){
    const mins=Math.round(n*24*60);
    const h=Math.floor(mins/60).toString().padStart(2,'0');
    const m=(mins%60).toString().padStart(2,'0');
    return h+':'+m;
  }
  return s.slice(0,5);
}

/* ── FORMATO FECHA CSV ── */
function todayStr(){
  const n=new Date();
  const y=n.getFullYear();
  const m=String(n.getMonth()+1).padStart(2,'0');
  const d=String(n.getDate()).padStart(2,'0');
  return `${y}-${m}-${d}`;
}

function normalizeDate(s){
  if(!s||s==='None'||s==='null') return '';
  s=String(s).trim();
  if(/^\d{5}$/.test(s)){const d=new Date(Math.round((parseFloat(s)-25569)*86400*1000));return d.toISOString().slice(0,10);}
  if(/^\d{4}-\d{2}-\d{2}/.test(s)) return s.slice(0,10);
  if(/^\d{1,2}\/\d{1,2}\/\d{2,4}/.test(s)){const p=s.split('/');const y=p[2].length===2?'20'+p[2]:p[2];return `${y}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
  if(/^\d{1,2}-\d{1,2}-\d{4}/.test(s)){const p=s.split('-');return `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`;}
  return s.slice(0,10);
}

/* ── RENDER ── */
function render(rows){
  const today=todayStr();
  let data=rows;

  // Debug completo
  if(rows.length>0){
    const keys=Object.keys(rows[0]);
    console.log('[Panel] Columnas recibidas:', JSON.stringify(keys));
    console.log('[Panel] Primera fila:', JSON.stringify(rows[0]));
    const s=col(rows[0],'FECHA','Fecha de Servicio','FECHA DE SERVICIO','fecha');
    console.log('[Panel] Fecha:', s, '-> normalizada:', normalizeDate(s), '| Hoy:', today);
    console.log('[Panel] Total filas:', rows.length, '| Filas de hoy:', data.length);
  }

  // Filtrar solo hoy si está activado
  if(SOLO_HOY){
    data=rows.filter(r=>{
      const raw=col(r,'FECHA','Fecha de Servicio','FECHA DE SERVICIO','fecha');
      return normalizeDate(raw)===today;
    });
  }

  // Stats
  const total=data.length;
  const prev=data.filter(r=>col(r,'TIPO','Tipo','tipo').toUpperCase()==='PREVENTIVO').length;
  const corr=data.filter(r=>col(r,'TIPO','Tipo','tipo').toUpperCase()==='CORRECTIVO').length;
  const exit=data.filter(r=>normConf(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado'))==='exitosa').length;
  const fall=data.filter(r=>normConf(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado'))==='fallida').length;
  const pend=data.filter(r=>normConf(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado'))==='pendiente').length;
  const pct=total?(Math.round((exit/total)*100)):0;

  document.getElementById('s-total').textContent=total;
  document.getElementById('s-prev').textContent=prev;
  document.getElementById('s-corr').textContent=corr;
  document.getElementById('s-exit').textContent=exit;
  document.getElementById('s-fall').textContent=fall;
  document.getElementById('s-pend').textContent=pend;
  document.getElementById('prog-fill').style.width=pct+'%';
  document.getElementById('prog-pct').textContent=pct+'% cumplimiento';

  // Ticker
  const tickItems=data.slice(0,20);
  const tickHTML=tickItems.map(r=>{
    const tipo=col(r,'TIPO','Tipo','tipo').toUpperCase();
    const cls=tipo==='PREVENTIVO'?'prev':tipo==='CORRECTIVO'?'corr':tipo?'':'prev';
    return `<span class="tick-item ${cls}">OT ${esc(col(r,'N° OT','OT','N OT','NRO OT','Nro OT')||'—')} · ${esc(col(r,'ACTIVIDAD','Nombre de la tarea','TAREA','Actividad').slice(0,45))}</span>`;
  }).join('');
  // Duplicate for seamless loop
  document.getElementById('ticker-track').innerHTML=tickHTML+tickHTML;

  // Alerta: OT fallidas
  const fallidas=data.filter(r=>normConf(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado'))==='fallida');
  const alertaEl=document.getElementById('alerta');
  if(fallidas.length){
    alertaEl.classList.add('on');
    document.getElementById('alerta-txt').textContent=
      '⚠  '+fallidas.map(r=>`OT ${col(r,'OT','N° OT','N OT')} — ${col(r,'Nombre de la tarea','ACTIVIDAD','TAREA').slice(0,40)}`).join('   ·   ⚠  ');
  } else alertaEl.classList.remove('on');

  // Tabla
  const tbody=document.getElementById('tbody');
  if(!data.length){
    tbody.innerHTML=`<tr class="empty-row"><td colspan="7">Sin órdenes de trabajo para hoy (${today})</td></tr>`;
    return;
  }

  // Ordenar: fallidas primero, luego pendientes, luego exitosas
  const order={fallida:0,pendiente:1,cancelado:2,exitosa:3};
  data.sort((a,b)=>(order[normConf(col(a,'CONFORMIDADES DEL SERVICIO','ESTADO','Estado','estado','CONFORMIDAD'))]||1)-(order[normConf(col(b,'CONFORMIDADES DEL SERVICIO','ESTADO','Estado','estado','CONFORMIDAD'))]||1));

  tbody.innerHTML=data.map((r,i)=>{
    const conf=normConf(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado'));
    const tipo=col(r,'TIPO','Tipo','tipo').toUpperCase();
    const tipoCls=tipo==='PREVENTIVO'?'prev':tipo==='CORRECTIVO'?'corr':tipo==='SUPERVISION'?'sup':tipo?'inf':'prev';
    const tipoLbl=tipo==='PREVENTIVO'?'Preventivo':tipo==='CORRECTIVO'?'Correctivo':tipo==='SUPERVISION'?'Supervisión':tipo||'Mantenimiento';
    const turno=col(r,'TURNO','Turno','turno').toUpperCase();
    const turnoCls=turno.includes('NOCHE')?'noche':'mañana';
    const hiIni=fmtHora(col(r,'HORA INICIO','Hora de Inicio','HORA_INICIO','HoraInicio'));
    const hiFin=fmtHora(col(r,'HORA FIN','Hora de Finalizacion','HORA_FIN','HoraFin'));
    const tarea=col(r,'ACTIVIDAD','Nombre de la tarea','TAREA','Actividad')||'—';
    const prov=col(r,'TECNICO','Proveedor','PROVEEDOR','Tecnico');
    const sol=col(r,'SOLICITANTE','Solicitante','solicitante');

    return `<tr class="${conf}" style="animation-delay:${Math.min(i,30)*0.02}s">
      <td><span class="ot">${esc(col(r,'N° OT','OT','N OT','NRO OT')||'—')}</span></td>
      <td><span class="tipo-badge ${tipoCls}">${esc(tipoLbl)}</span></td>
      <td>
        <div class="tarea-nombre">${esc(tarea)}</div>
        ${prov?`<div class="tarea-prov">${esc(prov)}</div>`:''}
      </td>
      <td><span class="hora-cell">${hiIni}<span class="hora-sep">→</span>${hiFin}</span></td>
      <td>${sol?`<span class="sol-chip">${esc(sol)}</span>`:'—'}</td>
      <td><span class="turno-mini ${turnoCls}">${esc(turno||'—')}</span></td>
      <td><span class="conf-badge ${conf}">${esc(confLabel(col(r,'ESTADO','CONFORMIDADES DEL SERVICIO','Estado','CONFORMIDAD','estado')))}</span></td>
    </tr>`;
  }).join('');
}

/* ── CARGA VÍA GOOGLE VISUALIZATION API (sin CORS, funciona en cualquier dominio) ── */
// Carga datos via JSONP con timeout garantizado
function loadSheet(csvUrl) {
  return new Promise((resolve) => {
    const id = getSheetId(csvUrl);
    const gid = getGid(csvUrl);
    const cb = 'gscb_' + Date.now();
    let done = false;

    // Timeout de 6 segundos — siempre resuelve
    const timer = setTimeout(() => {
      if (!done) { done = true; cleanup(); resolve(null); }
    }, 6000);

    function cleanup() {
      clearTimeout(timer);
      delete window[cb];
      document.getElementById('gs_' + cb)?.remove();
    }

    window[cb] = (data) => {
      if (done) return;
      done = true;
      cleanup();
      if (!data || !data.table) { resolve(null); return; }
      try {
        const cols = data.table.cols.map(c => (c.label || c.id || '').trim());
        const rows = data.table.rows.map(r =>
          (r.c || []).map((c, i) => {
            if (!c || c.v === null || c.v === undefined) return '';
            const v = c.f || c.v; // prefer formatted value
            if (typeof c.v === 'string' && c.v.startsWith('Date(')) {
              const p = c.v.slice(5,-1).split(',').map(Number);
              return p[0]+'-'+String(p[1]+1).padStart(2,'0')+'-'+String(p[2]).padStart(2,'0');
            }
            return String(v).replace(/,/g, ' ');
          }).join(',')
        );
        resolve([cols.join(','), ...rows].join('
'));
      } catch(e) { resolve(null); }
    };

    const s = document.createElement('script');
    s.id = 'gs_' + cb;
    s.onerror = () => { if(!done){done=true;cleanup();resolve(null);} };
    s.src = 'https://docs.google.com/spreadsheets/d/e/' + id +
            '/gviz/tq?tqx=out:json&gid=' + gid + '&callback=' + cb + '&_t=' + Date.now();
    document.head.appendChild(s);
  });
}

async function fetchWithProxy(sheetUrl) {
  return loadSheet(sheetUrl);
}

/* ── FETCH DATA ── */
let firstLoad = true;
function hideOverlay() {
  document.getElementById('overlay').classList.add('hide');
  firstLoad = false;
}

async function load() {
  const dot = document.getElementById('sdot');
  const txt = document.getElementById('sync-txt');
  dot.className = 'sdot busy';
  txt.textContent = 'Actualizando...';

  // Timeout de seguridad: ocultar overlay después de 8s pase lo que pase
  if (firstLoad) setTimeout(hideOverlay, 8000);

  const csvProg = await fetchWithProxy(URL_PROGRAMACION);
  hideOverlay();

  if (csvProg) {
    const rows = parseCSV(csvProg);
    render(rows);
    dot.className = 'sdot';
    txt.textContent = 'Actualizado ' + new Date().toLocaleTimeString('es-PE', {hour:'2-digit',minute:'2-digit'});
  } else {
    dot.className = 'sdot err';
    txt.textContent = 'Sin conexión — reintentando';
  }

  // Comunicados en paralelo (no bloquea)
  fetchWithProxy(URL_COMUNICADOS).then(csv => {
    if (csv) renderComs(parseCSV(csv));
  });
}

load();
setInterval(load,REFRESH_SEG*1000);
